services:
  - type: web
    name: ceki-online
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    # NOTE: room/game state lives in memory (server/pokergame/RoomManager.js),
    # so this service must never run more than one instance -- a second one
    # would hold its own separate set of rooms and players would silently fail
    # to see each other. Not pinned with `numInstances` here because scaling
    # is a paid feature and the key is rejected on the free plan, which would
    # fail the whole blueprint. The free plan is single-instance anyway; if
    # this service is ever upgraded, keep scaling at 1.
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Set this by hand to the MongoDB Atlas connection string. Leaving it
      # empty is NOT harmless: server/config/db.js silently falls back to an
      # in-memory database, so the app boots normally but every account is
      # wiped on each restart.
      - key: MONGO_URI
        sync: false
      # Google sign-in. The client id is public by nature -- it is visible in
      # the page source of every site that offers Google sign-in -- so it is
      # committed rather than kept out of the repo. There is no client secret
      # here: this flow verifies the ID token Google hands the browser, which
      # needs only the id. Both copies must match; the browser one is baked
      # into the bundle at build time, the server one is the audience the
      # token has to have been issued for.
      - key: GOOGLE_CLIENT_ID
        value: 706018926108-r3uib4sqkqfu23pr1fon5dc7q8b4ps1s.apps.googleusercontent.com
      - key: REACT_APP_GOOGLE_CLIENT_ID
        value: 706018926108-r3uib4sqkqfu23pr1fon5dc7q8b4ps1s.apps.googleusercontent.com
